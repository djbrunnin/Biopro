<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BioPro Editor</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="editor-header">

    <div>
        <h1>BioPro</h1>
        <span>Editor</span>
    </div>

    <button
        id="visualizarTopo"
        type="button"
    >
        Abrir página
    </button>

</header>


<main class="editor-layout">


    <!-- =========================
         PAINEL
         ========================= -->

    <section class="editor-panel">


        <div class="editor-card">

            <h2>Perfil</h2>

            <label>
                Nome

                <input
                    id="nome"
                    type="text"
                    placeholder="Nome do cliente"
                >

            </label>


            <label>
                Descrição

                <textarea
                    id="descricao"
                    placeholder="Descrição"
                ></textarea>

            </label>

        </div>


        <div class="editor-card">

            <h2>Tema</h2>

            <select id="tema">

                <option value="botanic">
                    Botanic
                </option>

                <option value="luxury">
                    Luxury
                </option>

                <option value="romantic">
                    Romantic
                </option>

                <option value="barber">
                    Barber
                </option>

            </select>

        </div>


        <div class="editor-card">

            <h2>Links</h2>

            <div id="linksEditor"></div>

            <button
                id="adicionarLink"
                class="button-secondary"
                type="button"
            >
                + Adicionar link
            </button>

        </div>


        <div class="editor-card">

            <h2>Serviços</h2>

            <div id="servicosEditor"></div>

            <button
                id="adicionarServico"
                class="button-secondary"
                type="button"
            >
                + Adicionar serviço
            </button>

        </div>


        <div class="editor-card">

            <h2>Portfólio</h2>

            <div id="portfolioEditor"></div>

            <button
                id="adicionarFoto"
                class="button-secondary"
                type="button"
            >
                + Adicionar foto
            </button>

        </div>


        <div class="editor-card">

            <h2>Localização</h2>

            <label>
                Endereço

                <input
                    id="endereco"
                    type="text"
                >

            </label>

            <label>
                Link do mapa

                <input
                    id="mapa"
                    type="text"
                >

            </label>

        </div>


        <div class="editor-card">

            <h2>Componentes</h2>

            <div class="componentes-lista">

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compPerfil"
                    >
                    Perfil
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compLinks"
                    >
                    Links
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compDestaque"
                    >
                    Destaque
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compServicos"
                    >
                    Serviços
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compPortfolio"
                    >
                    Portfólio
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compLocalizacao"
                    >
                    Localização
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compRedes"
                    >
                    Redes sociais
                </label>

                <label class="check-item">
                    <input
                        type="checkbox"
                        id="compRodape"
                    >
                    Rodapé
                </label>

            </div>

        </div>


        <div class="editor-card">

            <h2>Ordem dos componentes</h2>

            <p class="helper">
                Use ↑ e ↓ para reorganizar.
            </p>

            <div id="ordemEditor"></div>

        </div>


        <div class="editor-actions">

            <button
                id="salvar"
                type="button"
            >
                Preparar configuração
            </button>

            <button
                id="visualizar"
                type="button"
            >
                Visualizar página
            </button>

        </div>


        <div
            id="mensagem"
            class="mensagem"
        ></div>


    </section>


    <!-- =========================
         PREVIEW
         ========================= -->

    <section class="preview-area">

        <div class="preview-header">
            <strong>Pré-visualização</strong>
        </div>

        <iframe
            id="preview"
            title="Pré-visualização BioPro"
        ></iframe>

    </section>


</main>


<script src="editor.js"></script>

</body>

</html>
