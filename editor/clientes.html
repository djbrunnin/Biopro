<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clientes | BioPro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f4ef;
            color: #26352d;
            font-family: Arial, sans-serif;
        }

        .topo {
            background: #ffffff;
            border-bottom: 1px solid #e5e0d5;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topo h1 {
            margin: 0;
            font-size: 22px;
        }

        .topo span {
            color: #68736c;
            font-size: 13px;
        }

        .sair {
            border: 1px solid #ddd8ce;
            background: #ffffff;
            color: #68736c;
            border-radius: 10px;
            padding: 9px 13px;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 25px 16px;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .cabecalho h2 {
            margin: 0 0 5px;
        }

        .cabecalho p {
            margin: 0;
            color: #68736c;
            font-size: 14px;
        }

        .novo {
            border: 0;
            background: #66796b;
            color: white;
            border-radius: 12px;
            padding: 13px 17px;
            font-weight: 600;
            white-space: nowrap;
        }

        .lista {
            display: grid;
            gap: 14px;
        }

        .cliente {
            background: #ffffff;
            border: 1px solid #e5e0d5;
            border-radius: 16px;
            padding: 18px;
        }

        .cliente-topo {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
        }

        .cliente h3 {
            margin: 0 0 5px;
            font-size: 17px;
        }

        .slug {
            color: #68736c;
            font-size: 13px;
        }

        .status {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .publicado {
            background: #e6f0e8;
            color: #41634b;
        }

        .rascunho {
            background: #eeeae2;
            color: #766b5a;
        }

        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .acoes button,
        .acoes a {
            display: inline-block;
            border: 1px solid #ddd8ce;
            background: #ffffff;
            color: #66796b;
            border-radius: 9px;
            padding: 9px 12px;
            text-decoration: none;
            font-size: 13px;
        }

        .acoes .editar {
            background: #66796b;
            border-color: #66796b;
            color: #ffffff;
        }

        .vazio {
            text-align: center;
            background: white;
            border: 1px dashed #ddd8ce;
            border-radius: 16px;
            padding: 40px 20px;
            color: #68736c;
        }

        .mensagem {
            min-height: 20px;
            margin: 15px 0;
            text-align: center;
            font-size: 14px;
        }

        .modal-fundo {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 50;
        }

        .modal-fundo.aberto {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 18px;
            padding: 24px;
        }

        .modal h2 {
            margin-top: 0;
        }

        .modal label {
            display: block;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .modal input {
            width: 100%;
            margin-top: 7px;
            padding: 13px;
            border: 1px solid #ddd8ce;
            border-radius: 10px;
            font-size: 15px;
        }

        .modal-acoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-acoes button {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #ddd8ce;
            background: white;
        }

        .modal-acoes .criar {
            background: #66796b;
            color: white;
            border-color: #66796b;
        }

        @media (max-width: 600px) {

            .cabecalho {
                align-items: stretch;
                flex-direction: column;
            }

            .novo {
                width: 100%;
            }

            .cliente-topo {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<header class="topo">

    <div>
        <h1>BioPro</h1>
        <span>Gerenciador de clientes</span>
    </div>

    <button
        class="sair"
        id="sair"
        type="button"
    >
        Sair
    </button>

</header>


<main>

    <section class="cabecalho">

        <div>
            <h2>Meus clientes</h2>

            <p>
                Gerencie todas as páginas BioPro.
            </p>
        </div>

        <button
            class="novo"
            id="novoCliente"
            type="button"
        >
            + Novo cliente
        </button>

    </section>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <section
        id="lista"
        class="lista"
    ></section>

</main>


<div
    id="modalFundo"
    class="modal-fundo"
>

    <div class="modal">

        <h2>Novo cliente</h2>

        <label>
            Nome do cliente

            <input
                id="novoNome"
                type="text"
                placeholder="Ex.: Studio Bella"
            >
        </label>

        <div class="modal-acoes">

            <button
                id="cancelar"
                type="button"
            >
                Cancelar
            </button>

            <button
                id="criar"
                class="criar"
                type="button"
            >
                Criar cliente
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="clientes.js"></script>

</body>

</html>
