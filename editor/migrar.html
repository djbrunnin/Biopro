<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Migrar | BioPro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f4ef;
            font-family: Arial, sans-serif;
            color: #26352d;
        }

        .box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #e5e0d5;
            box-shadow: 0 15px 40px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #66796b;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f4ef;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>BioPro</h1>

    <p>
        Migração do cliente para o Supabase.
    </p>

    <button id="migrar">
        Migrar cliente-001
    </button>

    <div id="resultado">
        Aguardando...
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script>

const resultado =
    document.getElementById("resultado");

document
    .getElementById("migrar")
    .addEventListener("click", async () => {

        resultado.textContent =
            "Iniciando migração...";

        try {

            // 1. Verifica usuário logado

            const {
                data: sessaoData,
                error: sessaoError
            } = await supabaseClient.auth.getSession();

            if (sessaoError) {
                throw sessaoError;
            }

            const sessao =
                sessaoData.session;

            if (!sessao) {
                throw new Error(
                    "Você não está logado."
                );
            }

            const usuario =
                sessao.user;

            resultado.textContent =
                "Usuário identificado.\n" +
                usuario.email +
                "\n\nLendo configuração...";


            // 2. Busca o config.js atual

            const resposta =
                await fetch(
                    "../clientes/cliente-001/config.js"
                );

            if (!resposta.ok) {
                throw new Error(
                    "Não foi possível encontrar o config.js."
                );
            }

            const texto =
                await resposta.text();


            // 3. Extrai BIOPRO_CONFIG

            const inicio =
                texto.indexOf(
                    "const BIOPRO_CONFIG ="
                );

            if (inicio === -1) {
                throw new Error(
                    "BIOPRO_CONFIG não encontrada."
                );
            }

            const codigo =
                texto.substring(inicio);

            const expressao =
                codigo
                    .replace(
                        "const BIOPRO_CONFIG =",
                        ""
                    )
                    .trim()
                    .replace(/;$/, "");

            const config =
                Function(
                    `"use strict";
                    return (${expressao});`
                )();


            // 4. Grava no Supabase

            resultado.textContent =
                "Configuração encontrada.\n\n" +
                "Salvando no Supabase...";


            const {
                data,
                error
            } = await supabaseClient
                .from("clients")
                .upsert(
                    {
                        owner_id: usuario.id,

                        slug: "cliente-001",

                        name:
                            config.perfil?.nome ||
                            "Cliente 001",

                        config: config,

                        published: true,

                        updated_at:
                            new Date().toISOString()
                    },
                    {
                        onConflict: "slug"
                    }
                )
                .select()
                .single();


            if (error) {
                throw error;
            }


            // 5. Sucesso

            resultado.textContent =
                "✅ MIGRAÇÃO CONCLUÍDA!\n\n" +

                "Cliente: " +
                data.name +
                "\n\n" +

                "Slug: " +
                data.slug +
                "\n\n" +

                "Supabase ID: " +
                data.id +
                "\n\n" +

                "Agora o cliente está salvo no banco.";

        } catch (erro) {

            console.error(erro);

            resultado.textContent =
                "❌ ERRO\n\n" +
                (erro.message || erro);

        }

    });

</script>

</body>

</html>
